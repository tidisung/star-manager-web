<!doctype html><html lang="ko"><head><meta name="referrer" content="no-referrer"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#222639"><title>별빛 원정대 · 30초 액션 전투</title><link rel="stylesheet" href="/star-manager-web/action.css?v=84"></head><body>
<main class="game-shell">
 <header class="masthead"><a class="wordmark" href="/star-manager-web/adventure.html?demo=1"><span>✦</span><div><h1>별빛 원정대</h1><p>달빛 숲의 작은 영웅들</p></div></a><div class="top-actions"><span class="test-badge">30초 액션 체험</span><button id="sound" aria-pressed="true">소리 켜짐</button><button id="fullscreen">전체 화면</button></div></header>
 <section class="arena" id="arena" aria-label="2D 만화 전투 체험">
  <canvas id="scene" width="1280" height="720" role="img" aria-label="고양이 기사가 달려가 검을 휘두르고 토끼 궁수와 곰 마법사가 돕는 만화 스타일 전투"></canvas>
  <div class="hud"><div class="chapter"><span class="chapter-icon">☾</span><div><small>CHAPTER 01</small><b>달빛 숲</b></div></div><div class="clock"><span id="clock">30</span><small>초</small></div><div class="combat-score"><b id="killCount">0</b><span>처치</span><button id="pause" aria-label="일시정지" disabled>Ⅱ</button></div></div>
  <div class="combo" id="combo" aria-hidden="true"><strong>0</strong><span>COMBO!</span></div>
  <div class="intro" id="intro"><div class="intro-tag">작은 친구들, 커다란 한 방!</div><h2>달려들고, 때리고,<br><em>시원하게 날려버려!</em></h2><p>자동 전투를 보면서 아래 세 가지 기술을 눌러봐요.</p><button class="start-button" id="start">30초 전투 시작 <span>▶</span></button><small>실제 별을 쓰지 않는 액션 체험이에요.</small></div>
  <div class="pause-cover" id="pauseCover" hidden><h2>잠깐 쉬어가기</h2><button id="resume">계속하기</button></div>
  <div class="ending" id="ending" hidden><span class="ending-star">✦</span><p>30초 전투 완료</p><h2>멋진 한 판이었어!</h2><div class="result-stats" id="results"></div><button class="start-button" id="replay">한 번 더 해보기 <span>↻</span></button></div>
  <div class="stage-caption" id="stageCaption">기사는 돌진 · 궁수는 화살 · 마법사는 폭발</div><div class="timeline"><i id="timeBar"></i></div>
 </section>
 <section class="skillbar" aria-label="특수 기술"><button class="skill amber" id="dash" disabled><span class="skill-icon">ϟ</span><span class="skill-copy"><small>고양이 기사</small><b>번개 돌진</b><em>달려들어 한꺼번에 날려요</em></span><span class="key">1</span><span class="cooldown" aria-hidden="true"></span></button><button class="skill mint" id="volley" disabled><span class="skill-icon">➶</span><span class="skill-copy"><small>토끼 궁수</small><b>화살비</b><em>하늘에서 쏟아지는 화살</em></span><span class="key">2</span><span class="cooldown" aria-hidden="true"></span></button><button class="skill lilac" id="meteor" disabled><span class="skill-icon">✦</span><span class="skill-copy"><small>곰 마법사</small><b>별똥별</b><em>커다란 별 하나, 시원한 폭발</em></span><span class="key">3</span><span class="cooldown" aria-hidden="true"></span></button></section>
 <footer><p><span class="status-light"></span><span id="status" role="status">시작을 누르면 소리와 함께 전투가 시작돼요.</span></p><label><input id="shake" type="checkbox" checked> 화면 흔들림</label><a href="/star-manager-web/adventure.html?demo=1">슬롯 모험으로</a></footer>
</main><script type="module" src="/star-manager-web/action-ui.js?v=84"></script></body></html>
